  <rect x="100" y="100" width="824" height="824" rx="188" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
    <rect x="100" y="100" width="824" height="410" fill="url(#sheen)"/>
  </g>
  <rect x="103" y="103" width="818" height="818" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="6"/>
  <g filter="url(#shadow)" fill="none" stroke="url(#ring)" stroke-linecap="round">
    <circle cx="500" cy="500" r="215" stroke-width="92"/>
    <path d="M560 540 L700 690" stroke-width="86"/>
