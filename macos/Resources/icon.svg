      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#0b0b3a" flood-opacity="0.45"/>
    </filter>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="188"/></clipPath>
